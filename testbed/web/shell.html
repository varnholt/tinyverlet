<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tinyverlet testbed</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e20; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
    #link { position: fixed; right: 12px; bottom: 10px; color: #8ab4f8; text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">loading...</div>
  <a id="link" href="https://github.com/varnholt/tinyverlet">github.com/varnholt/tinyverlet</a>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (text) { document.getElementById('status').textContent = text; },
      onRuntimeInitialized: function () { document.getElementById('canvas').focus(); },
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); }
    };
    window.addEventListener('error', function () { Module.setStatus('the testbed needs WebGL2'); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
