name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-14
            os: ubuntu-24.04
            cxx: g++-14
          - name: clang-19
            os: ubuntu-24.04
            cxx: clang++-19
            packages: clang-19
          - name: msvc
            os: windows-latest
            testbed: ON

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTINYVERLET_BUILD_TESTBED=${{ matrix.testbed || 'OFF' }}
        env:
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install and consume with find_package
        if: runner.os == 'Linux'
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --install build --prefix "$PWD/prefix"
          cmake -S tests/package_consumer -B consumer -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer
          ./consumer/consumer

  testbed-linux:
    name: testbed (Linux, Mesa)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW and Mesa dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libgles-dev libegl-dev libgl1-mesa-dri xvfb

      - name: Build
        env:
          CXX: g++-14
          CC: gcc-14
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTINYVERLET_BUILD_TESTBED=ON
          cmake --build build

      - name: Render screenshots with software OpenGL ES
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          for scene in "cloth on sphere" "three sheets" "curtain in the wind" "tearable cloth" ropes "soft boxes"; do
            xvfb-run -a ./build/testbed/tinyverlet_testbed --scene "$scene" --time 2 \
              --size 640x400 --screenshot "screenshot-${scene// /-}.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: testbed-screenshots
          path: screenshot-*.png

  web:
    name: web (Emscripten, WebGL2)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DTINYVERLET_BUILD_TESTBED=ON
          cmake --build build-web

      - name: Test under Node
        run: ctest --test-dir build-web --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: testbed-web
          path: |
            build-web/testbed/tinyverlet_testbed.html
            build-web/testbed/tinyverlet_testbed.js
            build-web/testbed/tinyverlet_testbed.wasm

  pages:
    name: deploy live demo
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [web, demo-web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testbed-web
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: rust-demo-web
          path: site/rust

      - name: Use the testbed as the start page
        run: mv site/tinyverlet_testbed.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  demo-native:
    name: Rust demo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust/demo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
      - name: Linux windowing dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libegl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/demo -> target
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: rust-demo-${{ runner.os }}
          path: |
            rust/demo/target/release/tinyverlet-demo
            rust/demo/target/release/tinyverlet-demo.exe

  demo-web:
    name: Rust demo (WebAssembly / WebGL2)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/demo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/demo -> target
          cache-directories: ~/.cargo/bin
      - name: Install JavaScript bindings generator
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q '0.2.130'; then
            cargo install wasm-bindgen-cli --version 0.2.130 --locked
          fi
      - run: python3 tools/build_web.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test driver
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Render browser scenarios and test inputs
        run: node tools/smoke_web.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-demo-screenshots
          path: rust/demo/screenshots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: rust-demo-web
          path: rust/demo/dist
